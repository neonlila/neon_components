identifier: neon/image-alignment
fields:
- identifier: pi_flexform
  label: "Alignment"
  useExistingField: true
  type: FlexForm
  fields:
    - identifier: alignmentPosition
      label: "Image alignment"
      type: Select
      renderType: selectSingle
      items:
        - label: "Image left"
          value: 'left'
        - label: "Image center"
          value: 'center'
        - label: "Image right"
          value: 'right'    